name: CI Pipeline

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-and-build:
    name: Audit, Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          npm audit --audit-level=moderate
          npm audit signatures

      - name: Scan tracked files for secrets
        run: npm run security:scan

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Next.js production build
        run: npm run build

      - name: Capture Build Logs on Failure
        if: failure()
        run: |
          mkdir -p ci-logs
          echo "=== Node & Environment Info ===" > ci-logs/environment.log
          node -v >> ci-logs/environment.log
          npm -v >> ci-logs/environment.log
          echo "=== NPM Logs ===" >> ci-logs/environment.log
          cp -r ~/.npm/_logs/* ci-logs/ 2>/dev/null || true
          git status >> ci-logs/git-status.log 2>&1 || true

      - name: Upload CI Error & Log Artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-failure-logs
          path: ci-logs/
          retention-days: 7
