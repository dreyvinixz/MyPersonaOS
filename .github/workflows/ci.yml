name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Next.js production build
        run: npm run build

      - name: Capture Build Logs on Failure
        if: failure()
        run: |
          mkdir -p ci-logs
          echo "=== Node & Environment Info ===" > ci-logs/environment.log
          node -v >> ci-logs/environment.log
          npm -v >> ci-logs/environment.log
          echo "=== NPM Logs ===" >> ci-logs/environment.log
          cp -r ~/.npm/_logs/* ci-logs/ 2>/dev/null || true
          git status >> ci-logs/git-status.log 2>&1 || true

      - name: Upload CI Error & Log Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: ci-logs/
          retention-days: 7
