name: One-time secure dependency refresh (v0.3 branch)

on:
  push:
    branches:
      - 'agent/v0.3-tasks-projects-crud'
    paths:
      - '.github/workflows/dependency-refresh-once.yml'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.repository == 'dreyvinixz/MyPersonaOS'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/v0.3-tasks-projects-crud
          persist-credentials: true

      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Resolve patched runtime dependencies and non-breaking audit fixes
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@16.4.2 eslint-config-next@16.4.2
          npm audit fix --package-lock-only --ignore-scripts || true
          npm ci
          npm audit --omit=dev --audit-level=moderate
          node scripts/audit-dev-dependencies.mjs
          npm audit signatures

      - name: Verify app after dependency refresh
        run: |
          npm test
          npm run lint
          npx tsc --noEmit
          npm run security:scan
          npm run build

      - name: Commit checked package versions and remove one-time workflow
        run: |
          rm .github/workflows/dependency-refresh-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/dependency-refresh-once.yml
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "fix(deps): patch Next.js and supported transitive advisories"
          git push origin HEAD:refs/heads/agent/v0.3-tasks-projects-crud
