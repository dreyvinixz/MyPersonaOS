name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify build & typecheck
        run: |
          npx tsc --noEmit
          npm run build

      - name: Generate Detailed FrameBridge-Style Release Notes
        id: release_notes
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          COMMITS=$(git log -5 --pretty=format:"* %h - %s")
          
          NOTES=$(cat <<EOF
          # MyPersonaOS $TAG

          MyPersonaOS has been updated! This automated open-source release brings the latest personal-first operating system capabilities, UI refinements, and system enhancements compiled and verified directly from source.

          ---

          ### 🌟 What's Included

          * **Today Command Center:** Daily focus header, live DateClock, priority tasks checklist, and module summary cards.
          * **Quick Capture & Inbox:** Zero-friction input buffer supporting text, links, audio notes, and images.
          * **Tasks & Projects:** Goal-aligned task hierarchy (\`Goals → Projects → Tasks → Today\`) with interactive state.
          * **Content Studio:** Multi-brand content pipeline supporting **CodeToday** (programming), **Personal** (tech/philosophy), and **Quant Base** (institutional finance).
          * **English Lab:** Spaced-repetition vocabulary acquisition framework tracking active mastery levels (1-5).
          * **Reactive Storage:** Client-side \`localStorage\` state management (\`usePersonaState\`) with real-time UI synchronization.
          * **CI/CD & Diagnostics:** Automated GitHub Actions build verification and error log artifact capture.

          ---

          ### 📝 Changelog (Latest 5 Commits)

          $COMMITS

          ---

          ### 🚀 Getting Started & Installation

          1. Clone the repository:
             \`\`\`bash
             git clone https://github.com/dreyvinixz/MyPersonaOS.git
             cd MyPersonaOS
             \`\`\`
          2. Install dependencies:
             \`\`\`bash
             npm install
             \`\`\`
          3. Start the local development server:
             \`\`\`bash
             npm run dev
             \`\`\`
          4. Open [http://localhost:3000](http://localhost:3000) in your browser.

          ---

          ### ℹ️ Release Information

          * **Build Date:** $DATE
          * **Version Tag:** $TAG
          * **Node.js Environment:** v20.x
          * **Framework:** Next.js 15 (App Router, React 19)
          * **Status:** Passed TypeScript typecheck (\`npx tsc --noEmit\`) & Next.js production build (\`npm run build\`)
          * **License:** [MIT License](https://github.com/dreyvinixz/MyPersonaOS/blob/main/LICENSE)

          ---

          ### 🔒 Privacy & Security

          * **Zero Data Tracking:** MyPersonaOS is private and personal-first. No analytics or tracking scripts are included.
          * **Data Ownership:** All data remains stored inside your local browser (\`localStorage\`) in V0.1 and private Supabase RLS in V0.2.
          * **No Secrets Committed:** Environment configuration follows strict security guidelines (\`.gitignore\` and \`.env.example\`).

          ---

          *For detailed guides and architecture, see the [MyPersonaOS Wiki](https://github.com/dreyvinixz/MyPersonaOS/wiki).*
          EOF
          )

          EOF_MARKER=$(openssl rand -hex 8)
          echo "NOTES<<$EOF_MARKER" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "$EOF_MARKER" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: MyPersonaOS ${{ github.event.inputs.tag_name || github.ref_name }}
          body: ${{ steps.release_notes.outputs.NOTES }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture Release Build Logs on Failure
        if: failure()
        run: |
          mkdir -p release-logs
          echo "=== Release Build Failure Logs ===" > release-logs/environment.log
          node -v >> release-logs/environment.log
          npm -v >> release-logs/environment.log
          cp -r ~/.npm/_logs/* release-logs/ 2>/dev/null || true

      - name: Upload Release Error Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-logs
          path: release-logs/
          retention-days: 7
