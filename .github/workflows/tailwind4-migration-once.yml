name: One-time Tailwind 4 lockfile migration

on:
  push:
    branches:
      - 'agent/v0.3-tasks-projects-crud'
    paths:
      - '.github/workflows/tailwind4-migration-once.yml'

permissions:
  contents: write

jobs:
  refresh-tailwind-lock:
    if: github.repository == 'dreyvinixz/MyPersonaOS'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixed feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/v0.3-tasks-projects-crud
          persist-credentials: true

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Refresh lockfile for pinned Tailwind 4 packages
        run: |
          npm install --package-lock-only --ignore-scripts
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync("package-lock.json")); const missing=Object.entries(p.packages).filter(([k,v]) => k && (!v.integrity || !v.resolved)); console.log(JSON.stringify(missing.map(([k,v])=>({path:k, data:v})),null,2));'
          npm run security:lock
          npm ci --ignore-scripts

      - name: Verify dependency provenance and vulnerability baseline
        run: |
          npm audit --omit=dev --audit-level=moderate
          node scripts/audit-dev-dependencies.mjs
          npm audit signatures
          npm run security:scan

      - name: Test new Tailwind 4 build before committing
        run: |
          npm test
          npm run lint
          npx tsc --noEmit
          npm run build
          node --input-type=module -e 'import {readdirSync,readFileSync,statSync} from "node:fs"; import {join} from "node:path"; let css=""; function scan(d){for(const n of readdirSync(d)){const p=join(d,n);if(statSync(p).isDirectory())scan(p); else if(p.endsWith(".css"))css+=readFileSync(p,"utf8");}} scan(".next/static"); for(const name of [".rounded-xl",".bg-transparent",".oil-hero"]){if(!css.includes(name))throw Error("Missing required CSS selector: "+name)} console.log("Compiled Tailwind CSS selectors present");'

      - name: Commit reviewed lockfile and remove temporary workflow
        run: |
          rm .github/workflows/tailwind4-migration-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/tailwind4-migration-once.yml
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "build: lock Tailwind 4 verified dependency tree"
          git push origin HEAD:refs/heads/agent/v0.3-tasks-projects-crud
