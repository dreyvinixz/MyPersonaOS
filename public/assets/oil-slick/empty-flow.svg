<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="title desc">
  <title id="title">Empty flow illustration</title>
  <desc id="desc">Minimal iridescent abstract illustration for empty states in MyPersonaOS.</desc>
  <defs>
    <linearGradient id="oil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.28" stop-color="#8b5cf6"/>
      <stop offset="0.52" stop-color="#ec4899"/>
      <stop offset="0.76" stop-color="#34d399"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <ellipse cx="180" cy="124" rx="150" ry="92" fill="url(#halo)"/>
  <path d="M72 133c23-45 72-74 123-66 49 8 88 49 92 97" fill="none" stroke="#2a2c3a" stroke-width="1.5" stroke-dasharray="4 8"/>
  <path d="M89 140c25-37 64-57 105-51 41 6 75 35 84 75" fill="none" stroke="url(#oil)" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
  <path d="M112 144c24-27 54-38 84-32 29 6 51 25 61 54" fill="none" stroke="url(#oil)" stroke-width="5" stroke-linecap="round" opacity="0.2" filter="url(#soft)"/>
  <circle cx="91" cy="140" r="4.5" fill="#67e8f9"/>
  <circle cx="278" cy="164" r="4.5" fill="#34d399"/>
  <circle cx="199" cy="90" r="3.5" fill="#f472b6"/>

  <g transform="translate(145 103)">
    <rect x="0" y="0" width="70" height="70" rx="20" fill="#0d1018" stroke="#2c3042"/>
    <path d="M20 36 30 46 51 24" fill="none" stroke="url(#oil)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <circle cx="62" cy="79" r="2" fill="#8b5cf6" opacity="0.7"/>
  <circle cx="302" cy="92" r="2.5" fill="#22d3ee" opacity="0.75"/>
  <circle cx="304" cy="195" r="1.5" fill="#f59e0b" opacity="0.7"/>
  <circle cx="51" cy="188" r="1.5" fill="#ec4899" opacity="0.7"/>
</svg>
