<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Oil Slick contour lines</title>
  <desc id="desc">Transparent iridescent contour-line background for MyPersonaOS surfaces and banners.</desc>
  <defs>
    <linearGradient id="oil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.25" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#ec4899"/>
      <stop offset="0.75" stop-color="#34d399"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="warp" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.015" numOctaves="2" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="38" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
  </defs>

  <g fill="none" stroke="url(#oil)" stroke-linecap="round" filter="url(#warp)">
    <path d="M-70 370C80 225 198 230 315 304c120 75 203 70 310-16 99-80 198-67 352 30" stroke-width="1.2" opacity="0.18"/>
    <path d="M-55 404C93 264 205 269 322 339c119 72 207 68 313-17 101-81 205-65 348 33" stroke-width="1" opacity="0.15"/>
    <path d="M-37 437C105 305 216 306 332 374c119 69 211 63 318-20 100-78 202-60 339 38" stroke-width="0.9" opacity="0.12"/>
    <path d="M55 180c76-92 193-123 297-79 79 34 121 109 207 111 89 2 145-70 254-43" stroke-width="1" opacity="0.13"/>
    <path d="M80 208c75-80 177-105 269-68 78 31 123 100 209 102 82 2 141-60 237-38" stroke-width="0.8" opacity="0.1"/>
    <ellipse cx="662" cy="426" rx="116" ry="65" stroke-width="1" opacity="0.12" transform="rotate(-14 662 426)"/>
    <ellipse cx="662" cy="426" rx="86" ry="44" stroke-width="0.8" opacity="0.09" transform="rotate(-14 662 426)"/>
  </g>
</svg>
