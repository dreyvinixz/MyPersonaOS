<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="title desc">
  <title id="title">Oil Slick orb</title>
  <desc id="desc">Iridescent liquid orb for decorative use in the MyPersonaOS Today dashboard.</desc>
  <defs>
    <radialGradient id="core" cx="34%" cy="28%" r="76%">
      <stop offset="0" stop-color="#f8fafc" stop-opacity="0.94"/>
      <stop offset="0.08" stop-color="#67e8f9" stop-opacity="0.95"/>
      <stop offset="0.26" stop-color="#8b5cf6" stop-opacity="0.96"/>
      <stop offset="0.5" stop-color="#ec4899" stop-opacity="0.9"/>
      <stop offset="0.72" stop-color="#34d399" stop-opacity="0.84"/>
      <stop offset="0.88" stop-color="#f59e0b" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0.18"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.28" stop-color="#8b5cf6"/>
      <stop offset="0.52" stop-color="#ec4899"/>
      <stop offset="0.76" stop-color="#34d399"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="warp" x="-35%" y="-35%" width="170%" height="170%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.019" numOctaves="2" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="24" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="240" cy="240" r="178" fill="none" stroke="url(#ring)" stroke-width="2" stroke-opacity="0.2"/>
  <circle cx="240" cy="240" r="150" fill="none" stroke="url(#ring)" stroke-width="1.5" stroke-opacity="0.12"/>

  <g filter="url(#warp)">
    <path d="M240 70c70-4 131 34 158 91 25 53 15 122-20 168-39 50-96 82-159 80-62-3-124-38-148-96-22-53-8-119 29-164 35-43 85-76 140-79Z" fill="url(#core)" opacity="0.92"/>
    <path d="M155 130c40-31 88-39 129-23 39 15 59 51 90 76-31-7-59 2-80 23-26 26-37 68-74 82-37 14-84-1-104-36-25-42-5-88 39-122Z" fill="#67e8f9" opacity="0.13"/>
    <path d="M299 150c41 17 72 53 77 95 5 38-12 79-42 103-27 22-64 29-98 18 35-14 55-40 65-75 10-36 0-71-2-106-1-12-1-24 0-35Z" fill="#f472b6" opacity="0.16"/>
  </g>

  <circle cx="180" cy="154" r="36" fill="#fff" opacity="0.07" filter="url(#glow)"/>
  <path d="M126 332c70 66 184 68 256 6" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round" opacity="0.18"/>
</svg>
