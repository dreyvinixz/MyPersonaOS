<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Oil Slick mesh background</title>
  <desc id="desc">Dark iridescent abstract background with violet, cyan, magenta, emerald and amber liquid glows.</desc>
  <defs>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.44"/>
      <stop offset="0.58" stop-color="#6d28d9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="0.58" stop-color="#0891b2" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magenta" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.28"/>
      <stop offset="0.62" stop-color="#a21caf" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emerald" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="0.66" stop-color="#0f766e" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="0.72" stop-color="#c2410c" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <filter id="liquid" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="88" xChannelSelector="R" yChannelSelector="B"/>
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.032"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020307" stop-opacity="0.82"/>
      <stop offset="0.42" stop-color="#06070d" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#020307" stop-opacity="0.76"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#05060a"/>
  <g filter="url(#liquid)">
    <ellipse cx="280" cy="180" rx="520" ry="340" fill="url(#violet)" transform="rotate(-12 280 180)"/>
    <ellipse cx="1230" cy="210" rx="470" ry="300" fill="url(#cyan)" transform="rotate(15 1230 210)"/>
    <ellipse cx="1130" cy="820" rx="530" ry="310" fill="url(#magenta)" transform="rotate(-17 1130 820)"/>
    <ellipse cx="360" cy="820" rx="470" ry="270" fill="url(#emerald)" transform="rotate(9 360 820)"/>
    <ellipse cx="820" cy="520" rx="400" ry="190" fill="url(#amber)" transform="rotate(-23 820 520)"/>
  </g>
  <path d="M-80 710C190 590 300 690 520 560S910 420 1130 520s330 70 550-80" fill="none" stroke="#c4b5fd" stroke-opacity="0.08" stroke-width="3"/>
  <path d="M-100 750C180 620 330 760 550 610S900 470 1140 560s350 80 560-40" fill="none" stroke="#67e8f9" stroke-opacity="0.06" stroke-width="2"/>
  <rect width="1600" height="1000" fill="url(#vignette)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.6"/>
</svg>
